<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1712" />
  <title>FootballCenter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/app.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <section id="banner" class="banner" hidden></section>
    <main id="view" class="view"><div class="center muted">⏳</div></main>
    <nav id="nav" class="nav" hidden>
      <button data-tab="home" class="nav-btn active"><span class="nav-ico">🏠</span><span data-i18n="nav_home">Home</span></button>
      <button data-tab="games" class="nav-btn"><span class="nav-ico">🎮</span><span data-i18n="nav_games">Games</span></button>
      <button data-tab="community" class="nav-btn"><span class="nav-ico">👥</span><span data-i18n="nav_community">Community</span></button>
      <button data-tab="profile" class="nav-btn"><span class="nav-ico">👤</span><span data-i18n="nav_profile">Profil</span></button>
    </nav>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app/translit.js"></script>
  <script src="/app/i18n.js"></script>
  <script src="/app/app.js"></script>
</body>
</html>
