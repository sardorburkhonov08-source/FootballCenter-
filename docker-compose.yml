# FootballCenter — to'liq mustaqil to'plam: ilova + PostgreSQL (+ ixtiyoriy avtomatik HTTPS).
#   docker compose up -d                    # ilova + baza (HTTPS'ni o'zingiz sozlaysiz)
#   docker compose --profile https up -d    # + Caddy: DOMAIN uchun bepul HTTPS sertifikat avtomatik
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: footballcenter
      POSTGRES_USER: footballcenter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni .env da kiriting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footballcenter -d footballcenter"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://footballcenter:${POSTGRES_PASSWORD}@db:5432/footballcenter
      DATABASE_SSL: "false"
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
